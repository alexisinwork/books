name: Book workspace checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boilerplate tests
        working-directory: boilerplate
        run: python3 -m unittest discover -s tests -v
      - name: Boilerplate manifests
        working-directory: boilerplate
        run: python3 tools/studio.py doctor
      - name: Manuscript manifests
        working-directory: projects/riokka
        run: python3 tools/studio.py doctor
